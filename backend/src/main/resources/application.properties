# ---------- Server ----------
server.port=8080

# ---------- MySQL Datasource ----------
# Create the database first: CREATE DATABASE campus_events;
spring.datasource.url=jdbc:mysql://localhost:3306/campus_events?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=your_mysql_password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------- JPA / Hibernate ----------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ---------- JWT ----------
# In production, load this from an environment variable — never commit a real secret.
app.jwt.secret=replace-this-with-a-long-random-secret-key-at-least-32-chars
app.jwt.expiration-ms=86400000

# ---------- Logging ----------
logging.level.org.springframework.security=INFO
