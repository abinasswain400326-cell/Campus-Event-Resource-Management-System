<div class="auth-wrap">
  <form class="card auth-card" [formGroup]="form" (ngSubmit)="submit()">
    <h1>Create your account</h1>
    <p class="muted">New accounts start as Attendees — organizer access is granted by an admin</p>

    @if (errorMessage) {
      <div class="flash">{{ errorMessage }}</div>
    }

    <label>Full Name</label>
    <input type="text" formControlName="fullName" />

    <label>Email</label>
    <input type="email" formControlName="email" />

    <label>Password</label>
    <input type="password" formControlName="password" />

    <button type="submit" class="btn-primary" style="margin-top:18px;width:100%;" [disabled]="form.invalid">
      Create Account
    </button>

    <p class="muted" style="margin-top:14px;">
      Already have an account? <a routerLink="/login">Log in</a>
    </p>
  </form>
</div>
