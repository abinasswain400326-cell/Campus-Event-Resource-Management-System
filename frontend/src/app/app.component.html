<nav class="navbar">
  <a routerLink="/events" class="brand">🎓 Campus Events</a>
  <div class="nav-links">
    <a routerLink="/events">Events</a>
    @if (auth.hasRole('ADMIN', 'ORGANIZER')) {
      <a routerLink="/events/new">Create Event</a>
    }
    @if (auth.isLoggedIn()) {
      <span class="user-chip">{{ auth.currentUser()?.fullName }} ({{ auth.currentUser()?.role }})</span>
      <button class="btn-secondary" (click)="auth.logout()">Logout</button>
    } @else {
      <a routerLink="/login">Login</a>
      <a routerLink="/register">Register</a>
    }
  </div>
</nav>

<router-outlet></router-outlet>
